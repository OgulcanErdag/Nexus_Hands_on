<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" fill="none">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1BA0D7"/>
      <stop offset="100%" stop-color="#0D6E9E"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D24939"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009639"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="0" width="600" height="160" rx="16" fill="#0D1117"/>

  <!-- Decorative grid dots -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="20" cy="20" r="1.5"/>
    <circle cx="40" cy="20" r="1.5"/>
    <circle cx="60" cy="20" r="1.5"/>
    <circle cx="20" cy="40" r="1.5"/>
    <circle cx="40" cy="40" r="1.5"/>
    <circle cx="60" cy="40" r="1.5"/>
    <circle cx="20" cy="60" r="1.5"/>
    <circle cx="40" cy="60" r="1.5"/>
    <circle cx="60" cy="60" r="1.5"/>
    <circle cx="540" cy="100" r="1.5"/>
    <circle cx="560" cy="100" r="1.5"/>
    <circle cx="580" cy="100" r="1.5"/>
    <circle cx="540" cy="120" r="1.5"/>
    <circle cx="560" cy="120" r="1.5"/>
    <circle cx="580" cy="120" r="1.5"/>
    <circle cx="540" cy="140" r="1.5"/>
    <circle cx="560" cy="140" r="1.5"/>
    <circle cx="580" cy="140" r="1.5"/>
  </g>

  <!-- Icon: Nexus cube / artifact box -->
  <g transform="translate(32, 32)">
    <!-- Back face -->
    <path d="M48 8 L88 28 L88 72 L48 92 L8 72 L8 28 Z" fill="url(#accent)" opacity="0.3"/>
    <!-- Right face -->
    <path d="M48 48 L88 28 L88 72 L48 92 Z" fill="url(#accent)" opacity="0.6"/>
    <!-- Left face -->
    <path d="M48 48 L8 28 L8 72 L48 92 Z" fill="url(#accent)" opacity="0.8"/>
    <!-- Top face -->
    <path d="M48 8 L88 28 L48 48 L8 28 Z" fill="url(#accent)"/>
    <!-- Arrow cycling around the cube -->
    <path d="M50 2 L58 12 L52 10 L52 18 L44 18 L44 10 L38 12 Z" fill="url(#warm)" opacity="0.9"/>
  </g>

  <!-- Title text -->
  <text x="140" y="68" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    Nexus
  </text>
  <text x="248" y="68" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="300" fill="#8B949E" letter-spacing="-0.5">
    Hands-On Labs
  </text>

  <!-- Subtitle -->
  <text x="140" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B949E" letter-spacing="0.5">
    Repository Manager · Nginx Reverse Proxy · Jenkins CI/CD · AWS
  </text>

  <!-- Colored accent line -->
  <rect x="140" y="110" width="40" height="3" rx="1.5" fill="url(#accent)"/>
  <rect x="186" y="110" width="40" height="3" rx="1.5" fill="url(#warm)"/>
  <rect x="232" y="110" width="40" height="3" rx="1.5" fill="url(#green)"/>

  <!-- Bottom tags -->
  <g font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="11" fill="#58A6FF">
    <text x="140" y="138">maven</text>
    <text x="196" y="138">docker</text>
    <text x="256" y="138">terraform</text>
    <text x="330" y="138">certbot</text>
  </g>
</svg>
